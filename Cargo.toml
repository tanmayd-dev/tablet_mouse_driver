[package]
name = "tablet-mouse-driver"
version = "0.1.0"
edition = "2021"
description = "Translate Wacom tablet input into virtual mouse and Xbox 360 gamepad input on Linux"
license = "MIT"
readme = "README.md"

[lib]
name = "tablet_mouse_driver"
path = "src/lib.rs"

[[bin]]
name = "tablet-driver"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
env_logger = "0.11.11"
evdev = "0.13.2"
libc = "0.2"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = "0.4.5"
toml = "1.1.8"
